{% extends 'base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/admin_payment_form.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
{% endblock %}

{% block content %}

<div class="payment-container">

    <div class="page-header">
        <div>
            <h2><i class="fa-solid fa-credit-card"></i> Record Payment</h2>
            <p>Save member payment details.</p>
        </div>

        <a href="{% url 'admin_payments_list' %}" class="btn btn-light">
            <i class="fa-solid fa-arrow-left"></i> Back
        </a>
    </div>

    <div class="form-card">

        <form method="post" class="row g-4">
            {% csrf_token %}

            <div class="col-12">
                <div class="section-title">
                    <i class="fa-solid fa-user"></i>
                    Member &amp; Plan
                </div>
            </div>

            <div class="col-md-6">
                <label class="form-label">Member</label>
                <select name="member_id" class="form-select" required>
                    <option value="">Select Member</option>
                    {% for member in members %}
                    <option value="{{ member.id }}"
                        {% if plan and member.id == plan.member.id %}selected{% endif %}>
                        {{ member.full_name }} ({{ member.user.username }})
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-md-6">
                <label class="form-label">Plan</label>
                <select name="plan_id" class="form-select" required>
                    <option value="">Select Plan</option>
                    {% for plan in plans %}
                    <option value="{{ plan.id }}">
                        {{ plan.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-12">
                <div class="section-title">
                    <i class="fa-solid fa-money-bill-wave"></i>
                    Payment Information
                </div>
            </div>

            <div class="col-md-3">
                <label class="form-label">Amount</label>
                <input type="number" name="amount" class="form-control"
                       step="0.01" required placeholder="Enter amount">
            </div>

            <div class="col-md-3">
                <label class="form-label">Payment Date</label>
                <input type="date" name="payment_date"
                       class="form-control" required>
            </div>

            <div class="col-md-3">
                <label class="form-label">Mode</label>
                <select name="mode" class="form-select" required>
                    <option value="">Select Mode</option>
                    <option value="CASH">Cash</option>
                    <option value="CARD">Card</option>
                    <option value="ONLINE">Online</option>
                </select>
            </div>

            <div class="col-md-3">
                <label class="form-label">Status</label>
                <select name="status" class="form-select" required>
                    <option value="PAID">Paid</option>
                    <option value="PENDING">Pending</option>
                </select>
            </div>

            <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea name="notes" rows="3"
                          class="form-control"
                          placeholder="Additional payment notes"></textarea>
            </div>

            <div class="col-12">
                <div class="membership-box">

                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox"
                               name="set_membership" id="set_membership">
                        <label class="form-check-label" for="set_membership">
                            Also update member's membership using this payment
                        </label>
                    </div>

                    <label class="form-label">Membership Start Date</label>
                    <input type="date" name="membership_start"
                           class="form-control">

                    <small>
                        End date will be calculated automatically from the selected plan duration.
                    </small>

                </div>
            </div>

            <div class="col-12 text-end">
                <button class="btn save-btn">
                    <i class="fa-solid fa-floppy-disk"></i>
                    Save Payment
                </button>

                <a href="{% url 'admin_payments_list' %}"
                   class="btn cancel-btn">
                    Cancel
                </a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
