{% extends "base.html" %}
{% load static %}



{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 ">
    <h2> Membership Plans  </h2>

    <a href="{% url 'admin_plan_add' %}" class="btn btn-primary">Add New Plan </a>
</div>

    <table class="table table-bordered table-striped ">

        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Duration (months) </th>
                <th>Fee</th>
                <th>Actions</th>
            </tr>

        </thead>
        <tbody>
            {% for plan in plans %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td> {{plan.name }} </td>
                <td> {{plan.duration_months }} </td>
                <td> {{plan.fees}} </td>
                <td>
                    <div class="button-group">
                        <a href="{% url 'admin_plan_edit' plan.id %}" class="btn btn-sm btn-warning" > Edit </a>
                        <!-- delete button ko Features by form because it is more secure -->
                        <form method="post" action="{% url 'admin_plan_delete' plan.id %}" class="inline-form" >
                            {% csrf_token %}
                            <input type="hidden" name="plan_id" value="{{plan_id }}">
                            <button type="submit" class="btn btn-sm btn-danger " 
                            onclick = "return confirm('Are you sure you want to delete this plan ? ')">Delete </button>

                        </form>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>


{% endblock %}
