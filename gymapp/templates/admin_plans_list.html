{% extends "base.html" %}




{% block content %}

<div class="d-flex justify-content-between align-items-center mb-3 ">
    <h2> Membership Plans  </h2>

    <a href="{% url 'admin_plan_add' %}" class="btn btn-primary">Add New Plan </a>
</div>

    <table class="table table-bordered table-striped w-75">

        <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Duration (months) </th>
                <th>Fee</th>
                <th>Actions</th>
            </tr>

        </thead>
        <tbody>
            {% for plan in plans %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td> {{plan.name }} </td>
                <td> {{plan.duration_months }} </td>
                <td> {{plan.fees}} </td>
                <td>
                    <a href="{% url 'admin_plan_edit' plan.id %}" class="btn btn-sm btn-warning" > Edit </a>
                    <a href="" class="btn btn-sm btn-danger "> Delete </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>

    </table>


{% endblock %}
