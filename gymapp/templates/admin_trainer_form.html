{% extends 'base.html' %}

{% block content %}


<h2 class="mb-3">

    {% if mode == 'add' %} Add Trainer  {% else %} Edit Trainer {% endif %}
</h2>

<form method= "post" class= "row g-3 w-75" >
    {% csrf_token %}
    <div class="col-md-6">
        <label class="form-label">Trainer Name </label>
        <input type="text" name="name" class="form-control" value="{{trainer.name|default:'' }}">

    </div>

    <div class="col-md-3">
        <label class="form-label">mobile No:  </label>
        <input type="text" maxlength="10" name="mobile" class="form-control" 
                value="{{trainer.mobile|default:'' }}" >

    </div>

    <div class="col-md-3">
        <label class="form-label">Specialization</label>
        <input type="text" name="specialization" class="form-control" value="{{trainer.specialization|default:'' }}">

    </div>


    <div class="col-md-3">
        <label class="form-label">shift_Timing</label>
        <input type='text' name="shift_timing" class="form-control" value= "{{ trainer.shift_timing|default:'' }}"
        placeholder= "e.g 6AM - 10AM " >
    </div>

    <div class="col-md-3">
        <label class="form-label">experienced_years</label>
        <input type='number' min="0" step="1" name="experience_years" class="form-control" value= "{{ trainer.experience_years|default:'' }}" >
    </div>


    <!-- button for add plan ko lagie  -->
    <div class="col-md-12">
        <button type="submit" class="btn btn-primary" >
            {% if mode == 'add' %} Add Trainer {% else %} Update Trainer {% endif %}

        </button>
        <a href="{% url 'admin_trainers_list' %}" class="btn btn-secondary"> Cancel</a>
    </div>

</form>








{% endblock %}
